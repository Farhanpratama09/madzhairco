name: Break Reminder Push (WIB)

# External 5-minute scheduler compatible with Vercel Hobby plan.
# Runs between 11:00–12:55 UTC (18:00–19:55 WIB, Asia/Pontianak) every 5 minutes
# and calls /api/cron/break-reminder with CRON_SECRET.
# Required repository secrets:
#   - SITE_URL (e.g. https://madzhair.vercel.app)
#   - CRON_SECRET (must match CRON_SECRET env var in Vercel)

on:
  schedule:
    - cron: "*/5 10-12 * * *"
  workflow_dispatch:

jobs:
  trigger-break-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/break-reminder
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL atau CRON_SECRET belum diset di GitHub Secrets."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/api/cron/break-reminder" \
            -H "Authorization: Bearer ${CRON_SECRET}"
